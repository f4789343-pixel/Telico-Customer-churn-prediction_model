name: Run Tests

on:
 push:
 pull_requests:
 workflow_dispatch:

jobs:
 tests:
  run_on: ubuntu-latest

  env:
   POSTGRES_PASSWORD: postgres
   DB_HOST: 'localhost'
   DB_PORT: '5432'
   DB_NAME: 'Telico_churn'
   DB_USER: postgres
   DB_SSLMODE: disable
   
  steps: 
   - name: checkout repository
     uses: actions/checkout@v4

   - name: Set up python
     uses: actions/setup-python@v5
     with:
      python-version: "3.11"

   - name: Install denpendencies 
     run: | 
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest httpx

   - name: Start postgreSQL
     run: docker compose up -d db

   - name: wait for postgreSQL
     run: | 
      for i in {1..30}; do
       if docker compose exec -T db pg_isready -U postgres -d Telico-churn; then
        exit 0
        fi
       sleep 2
      done 
      docker compose logs db
      exit 1
   - name: Create prediction history table
     run: |
      docker compose exec -T db psql -U postgres -d Telico-churn -c "
      CREATE TABLE IF NOT EXISTS prediction_history(id serial primary key, 
      gender TEXT NOT NULL, SeniorCitizen INT NOT NULL, 
      Partner TEXT NOT NULL, Dependents TEXT NOT NULL, 
      tenure INT NOT NULL, PhoneService TEXT NOT NULL, 
      MultipleLines TEXT NOT NULL, 
      InternetService TEXT NOT NULL, OnlineSecurity TEXT NOT NULL, Contract TEXT NOT NULL, prediction INT NOT NULL,created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
   - name:  Run tests
     run: python -m pytest -v